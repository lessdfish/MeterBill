global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ["/etc/prometheus/rules/*.yml"]
scrape_configs:
  - job_name: meterbill
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /prometheus/meterbill-token
    static_configs:
      - targets: ["app1:8080", "app2:8080"]
