x-log: &default-log
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app: &app
  image: ${METERBILL_APP_IMAGE:-meterbill-app}:${METERBILL_VERSION:?required}
  build:
    context: ..
    target: app
    args: { APP_VERSION: "${METERBILL_VERSION}" }
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    SERVER_PORT: 8080
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    MYSQL_HOST: mysql
    MYSQL_HOST_PORT: 3306
    MYSQL_DATABASE: ${MYSQL_DATABASE:-meterbill}
    MYSQL_USER: ${MYSQL_USER:-meterbill}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_HOST_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER:-meterbill}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?required}
    REDIS_HOST: redis
    REDIS_HOST_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    METERBILL_JWT_SECRET_BASE64: ${METERBILL_JWT_SECRET_BASE64:?required}
    METERBILL_BOOTSTRAP_ENABLED: ${METERBILL_BOOTSTRAP_ENABLED:-false}
    METERBILL_BOOTSTRAP_TENANT_CODE: ${METERBILL_BOOTSTRAP_TENANT_CODE:-}
    METERBILL_BOOTSTRAP_EMAIL: ${METERBILL_BOOTSTRAP_EMAIL:-}
    METERBILL_BOOTSTRAP_PASSWORD: ${METERBILL_BOOTSTRAP_PASSWORD:-}
  depends_on:
    mysql: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 40s
  networks: [app_internal, data_internal]
  logging: *default-log
  mem_limit: 768m
  cpus: 1.0

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meterbill}
      MYSQL_USER: ${MYSQL_USER:-meterbill}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [data_internal]
    logging: *default-log
    mem_limit: 1g
    cpus: 1.0

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-meterbill}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [data_internal]
    logging: *default-log
    mem_limit: 512m
    cpus: 0.75

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?required}" }
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    networks: [data_internal]
    logging: *default-log
    mem_limit: 256m
    cpus: 0.5

  app1:
    <<: *app
  app2:
    <<: *app

  gateway:
    image: ${METERBILL_GATEWAY_IMAGE:-meterbill-gateway}:${METERBILL_VERSION:?required}
    build:
      context: ..
      target: gateway
      args: { APP_VERSION: "${METERBILL_VERSION}" }
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
    ports: ["127.0.0.1:${METERBILL_HTTP_PORT:-18080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway-health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [edge, app_internal]
    logging: *default-log
    mem_limit: 128m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METERBILL_PROMETHEUS_TOKEN" > /prometheus/meterbill-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
    environment:
      METERBILL_PROMETHEUS_TOKEN: ${METERBILL_PROMETHEUS_TOKEN:-invalid-local-token}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-19091}:9090"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge, app_internal]
    logging: *default-log
    mem_limit: 256m
    cpus: 0.5

networks:
  edge: {}
  app_internal: { internal: true }
  data_internal: { internal: true }

volumes:
  mysql_data: {}
  rabbitmq_data: {}
  redis_data: {}
  prometheus_data: {}
