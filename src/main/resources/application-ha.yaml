spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ROUTER_HOST:mysql-router}:${MYSQL_ROUTER_PORT:6446}/${MYSQL_DATABASE:meterbill}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672}

  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:meterbill-master}
        nodes: ${REDIS_SENTINEL_NODES:sentinel1:26379,sentinel2:26379,sentinel3:26379}

meterbill:
  messaging:
    queue-type: quorum
  redisson:
    mode: sentinel
    sentinel:
      master: ${REDIS_SENTINEL_MASTER:meterbill-master}
      nodes: ${REDIS_SENTINEL_NODES:sentinel1:26379,sentinel2:26379,sentinel3:26379}
